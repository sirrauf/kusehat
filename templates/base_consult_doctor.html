<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuSehat - {{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base_style_consult_doctor.css') }}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="{{ url_for('home') }}">
                <i class="fa-solid fa-heart-pulse"></i> KuSehat
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('consult_doctor') }}">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('about_consult_doctor') }}">Tentang Kami</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('contact_us_consult_doctor') }}">Kontak</a></li>
                    <li class="nav-item ms-lg-3">
                        <a href="#" class="btn btn-outline-primary btn-sm rounded-pill">
                            <i class="fa-solid fa-wallet"></i> Connect Wallet
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="content-wrapper">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-dark text-white pt-4 pb-2 mt-5">
        <div class="container text-center">
            <p>&copy; 2025 PT Ananda Technology Solution. All Rights Reserved.</p>
            <small>Innovative Health Technology & Web 3.0 Integration</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
